[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agy-swap"
version = "1.8.0"
description = "A small, dependency-free Python account switcher and quota monitor for Google Antigravity CLI (agy)"
readme = "README.md"
authors = [{ name = "@aklkbqx", email = "aklkbqx@users.noreply.github.com" }]
license = { text = "MIT" }
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.scripts]
agy-swap = "agy_swap.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
