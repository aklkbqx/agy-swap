worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    
    # Store temp files in /tmp so we don't need root
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp_path;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    sendfile on;
    keepalive_timeout 65;
    server_tokens off;

    server {
        listen 80;
        server_name _;
        
        root /usr/share/nginx/html;
        
        # Only allow GET and HEAD
        if ($request_method !~ ^(GET|HEAD)$) {
            return 405;
        }

        # Healthcheck
        location = /healthz {
            access_log off;
            default_type text/plain;
            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
            return 200 "OK\n";
        }

        # Hashed assets (Vite defaults to /assets/)
        # ^~ ensures it overrides the regex location below
        location ^~ /assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable, max-age=31536000";
            try_files $uri =404;
        }

        # HTML files (no-cache)
        location ~* \.html$ {
            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
            try_files $uri =404;
        }

        # This landing page has no API. Never disguise a missing API as SPA HTML.
        location ^~ /api/ {
            return 404;
        }

        # HTML and SPA fallback (extensionless routes)
        location / {
            # No-cache for document routes, fallback internally hits \.html$
            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
            try_files $uri $uri/ /index.html;
        }
        
        # Prevent fallback to HTML for missing assets with extensions
        location ~* \.[a-zA-Z0-9]+$ {
            # Provide some basic caching for unhashed assets if they exist
            expires 30d;
            add_header Cache-Control "public";
            try_files $uri =404;
        }
    }
}
